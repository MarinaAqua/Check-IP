<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek IP Proxy</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        form {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        input {
            padding: 10px;
            margin-right: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 200px;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background-color: #5cb85c;
            color: white;
            cursor: pointer;
            font-weight: 500;
        }
        button:hover {
            background-color: #4cae4c;
        }
        .result-container {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            padding: 20px;
            margin-top: 20px;
            max-width: 400px;
            margin: 20px auto;
        }
        .result-container p {
            margin: 8px 0;
            font-size: 16px;
        }
        .result-container span {
            font-weight: bold;
            display: inline-block;
            width: 150px;
        }
    </style>
</head>
<body>
    <h1>Cek Status IP Proxy</h1>
    <form id="proxyForm">
        <label for="ipPort">IP:Port:</label>
        <input type="text" id="ipPort" placeholder="Masukkan IP:Port" required>
        <button type="submit">Cek</button>
    </form>

    <div id="resultContainer" class="result-container"></div>

    <script>
        document.getElementById('proxyForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const ipPort = document.getElementById('ipPort').value;
            const [ip, port] = ipPort.split(':');
            const resultContainer = document.getElementById('resultContainer');
            resultContainer.innerHTML = '';

            if (!ip || !port) {
                alert('Format IP:Port tidak valid.');
                return;
            }

            // Fungsi untuk handle request API dengan error handling
            async function fetchData(apiUrl) {
                try {
                    const response = await fetch(apiUrl);
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    const data = await response.json();
                    return data;
                } catch (error) {
                    console.error('Error fetching data:', error);
                    return { status: 'Error', message: error.message };
                }
            }

            // API URLs
            const apiUrlEdTunnel = `https://proxyip.edtunnel.best/api?ip=${ip}&host=speed.cloudflare.com&port=${port}&tls=true`;
            const apiUrlDeta = `https://cfport-1-n2942152.deta.app/check?ip=${ip}&host=speed.cloudflare.com&port=${port}&tls=true`;
            const apiUrlBoilingFrame = `https://p01--boiling-frame--kw6dd7bjv2nr.code.run/check?ip=${ip}&host=speed.cloudflare.com&port=${port}&tls=true`;

            // Fetch data dari ketiga API
            const edTunnelData = await fetchData(apiUrlEdTunnel);
            const detaData = await fetchData(apiUrlDeta);
            const boilingFrameData = await fetchData(apiUrlBoilingFrame);

            // Menampilkan hasil
            resultContainer.innerHTML = `
                <p><span>IP:</span> ${ip}</p>
                <p><span>Port:</span> ${port}</p>
                <p><span>EDTunnel Status:</span> ${edTunnelData.status || edTunnelData.message}</p>
                <p><span>Deta Status:</span> ${detaData.status || detaData.message}</p>
                <p><span>Boiling Frame Status:</span> ${boilingFrameData.status || boilingFrameData.message}</p>
            `;
        });
    </script>
</body>
</html>

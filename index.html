<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengecekan IP Proxy dan ASN</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f4f4f9;
            padding: 20px;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background: #e9ecef;
            border-radius: 4px;
            line-height: 1.5;
            border-left: 4px solid #007BFF;
        }
        .error {
            color: red;
        }
        .success {
            color: green;
        }
        .loading {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center">Pengecekan IP Proxy dan ASN</h1>
        <div class="form-group">
            <input type="text" class="form-control" id="ipInput" placeholder="Masukkan IP atau IP:Port" required>
            <button class="btn btn-primary btn-block mt-2" onclick="checkProxyAndASN()">Cek Status IP Proxy</button>
        </div>
        <div class="form-group">
            <input type="text" class="form-control" id="asnInput" placeholder="Masukkan ASN (contoh: AS12345)" required>
            <button class="btn btn-secondary btn-block mt-2" onclick="searchProxiesByASN()">Cek Proxy dari ASN</button>
        </div>
        <div id="loading" class="loading text-center">
            <p>Memproses...</p>
        </div>
        <div id="result"></div>
    </div>

    <script>
        function showLoading() {
            document.getElementById("loading").style.display = 'block';
        }

        function hideLoading() {
            document.getElementById("loading").style.display = 'none';
        }

        function isValidIP(ip) {
            const ipRegex = /^(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){2}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$/;
            return ipRegex.test(ip);
        }

        async function checkProxy(ip, port) {
            return new Promise((resolve) => {
                const proxyUrl = `http://${ip}:${port}`;
                const xhr = new XMLHttpRequest();
                xhr.open('GET', proxyUrl, true);
                xhr.timeout = 5000; // Timeout after 5 seconds
                xhr.onreadystatechange = () => {
                    if (xhr.readyState === XMLHttpRequest.DONE) {
                        resolve(xhr.status === 200 ? 'Aktif' : 'Mati');
                    }
                };
                xhr.ontimeout = () => resolve('Mati');
                xhr.onerror = () => resolve('Mati');
                xhr.send();
            });
        }

        async function checkProxyAndASN() {
            const input = document.getElementById("ipInput").value.trim();
            let ip, port;

            if (input.includes(':')) {
                [ip, port] = input.split(':');
            } else {
                ip = input;
                port = 443; // Default port
            }

            if (!ip || !isValidIP(ip) || (port && (isNaN(port) || port < 1 || port > 65535))) {
                document.getElementById("result").innerHTML = '<span class="error">Masukkan format IP:Port yang valid.</span>';
                return;
            }

            showLoading();

            const geoUrl = `https://api.ipgeolocation.io/ipgeo?apiKey=02b4a2362c5147ec9996da7d6ceccd4c&ip=${ip}`;
            const infoUrl = `https://ipinfo.io/${ip}/json?token=acbb42696f81c4`;

            try {
                // Cek status IP
                const geoResponse = await fetch(geoUrl);
                if (!geoResponse.ok) throw new Error("IP tidak valid atau tidak terhubung");
                const geoData = await geoResponse.json();

                // Cek ASN dan informasi tambahan
                const infoResponse = await fetch(infoUrl);
                if (!infoResponse.ok) throw new Error("IP tidak valid untuk ASN");
                const infoData = await infoResponse.json();

                // Cek status proxy
                const proxyStatus = await checkProxy(ip, port);

                let result = `
                    <strong>Informasi IP:</strong><br>
                    IP: <span class="success">${geoData.ip}</span><br>
                    Port: <span class="success">${port}</span><br>
                    Status Proxy: <span class="success">${proxyStatus}</span><br>
                    ASN: <span class="success">${infoData.asn || 'Tidak tersedia'}</span><br>
                    ISP: ${geoData.isp}<br>
                    Lokasi: ${geoData.city || 'Tidak tersedia'}, ${geoData.country_name || 'Tidak tersedia'}<br>
                    Latitude: ${geoData.latitude}<br>
                    Longitude: ${geoData.longitude}<br>
                    Kode Negara: ${geoData.country_code}<br>
                `;

                document.getElementById("result").innerHTML = result;
            } catch (error) {
                document.getElementById("result").innerHTML = `<span class="error">Error: ${error.message}</span>`;
            } finally {
                hideLoading();
            }
        }

        async function searchProxiesByASN() {
            const asnInput = document.getElementById("asnInput").value.trim();
            if (!asnInput.startsWith("AS")) {
                document.getElementById("result").innerHTML = '<span class="error">Masukkan format ASN yang valid (contoh: AS12345).</span>';
                return;
            }

            showLoading();

            const censysUrl = `https://censys.io/api/v1/search/ipv4?q=asn:${asnInput}`;
            try {
                const censysResponse = await fetch(censysUrl, {
                    method: 'GET',
                    headers: {
                        'Authorization': 'Basic ' + btoa('564dd6d3-7124-41e8-8e4c-891bc9decaa4:e5gfXdAyf9ZFbXfSPeIKoTcFJk5pRhMD')
                    }
                });

                if (censysResponse.ok) {
                    const censysData = await censysResponse.json();
                    let result = `<strong>Daftar Proxy dari ${asnInput}:</strong><br>`;
                    if (censysData.results.length > 0) {
                        censysData.results.forEach(proxy => {
                            result += `IP: ${proxy.ip}, Port: ${proxy.port} <br>`;
                        });
                    } else {
                        result += 'Tidak ada proxy ditemukan untuk ASN ini.';
                    }
                    document.getElementById("result").innerHTML = result;
                } else {
                    throw new Error("Terjadi kesalahan saat menghubungi Censys.");
                }
            } catch (error) {
                document.getElementById("result").innerHTML = `<span class="error">Error: ${error.message}</span>`;
            } finally {
                hideLoading();
            }
        }
    </script>
</body>
</html>

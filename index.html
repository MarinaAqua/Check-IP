<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek IP Proxy</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .result { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Cek Status IP Proxy</h1>
    <form id="proxyForm">
        <label for="ip">IP Proxy:</label>
        <input type="text" id="ip" required>
        <label for="port">Port:</label>
        <input type="number" id="port" required>
        <button type="submit">Cek</button>
    </form>

    <div class="result" id="result"></div>

    <script>
        const apiUrls = [
            "https://cors-anywhere.herokuapp.com/https://proxyip.edtunnel.best/api?ip={ip}&host=speed.cloudflare.com&port={port}&tls=true",
            "https://cors-anywhere.herokuapp.com/https://cfport-1-n2942152.deta.app/check?ip={ip}&host=speed.cloudflare.com&port={port}&tls=true",
            "https://cors-anywhere.herokuapp.com/https://p01--boiling-frame--kw6dd7bjv2nr.code.run/check?ip={ip}&host=speed.cloudflare.com&port={port}&tls=true"
        ];

        document.getElementById('proxyForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const ip = document.getElementById('ip').value;
            const port = document.getElementById('port').value;
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '';

            for (const apiUrl of apiUrls) {
                const url = apiUrl.replace('{ip}', ip).replace('{port}', port);
                try {
                    const response = await fetch(url);
                    const data = await response.json();
                    const status = data.success ? 'Aktif' : 'Mati';
                    resultDiv.innerHTML += `<p>API: ${url} - Status: ${status}</p>`;
                } catch (error) {
                    resultDiv.innerHTML += `<p>API: ${url} - Error: ${error.message}</p>`;
                }
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek IP Proxy</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        form {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        input {
            padding: 10px;
            margin-right: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 200px;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background-color: #5cb85c;
            color: white;
            cursor: pointer;
            font-weight: 500;
        }
        button:hover {
            background-color: #4cae4c;
        }
        .result-container {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            padding: 20px;
            margin-top: 20px;
            max-width: 400px;
            margin: 20px auto;
        }
        .result-container p {
            margin: 8px 0;
            font-size: 16px;
        }
        .result-container span {
            font-weight: bold;
            display: inline-block;
            width: 150px;
        }
    </style>
</head>
<body>
    <h1>Cek Status IP Proxy</h1>
    <form id="proxyForm">
        <label for="ipPort">IP:Port:</label>
        <input type="text" id="ipPort" placeholder="Masukkan IP:Port" required>
        <button type="submit">Cek</button>
    </form>

    <div id="resultContainer" class="result-container"></div>

    <script>
        const apiKey = '02b4a2362c5147ec9996da7d6ceccd4c'; // Ganti dengan kunci API Anda

        document.getElementById('proxyForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const ipPort = document.getElementById('ipPort').value;
            const [ip, port] = ipPort.split(':');
            const resultContainer = document.getElementById('resultContainer');
            resultContainer.innerHTML = '';

            if (!ip || !port) {
                alert('Format IP:Port tidak valid.');
                return;
            }

            try {
                const apiUrl = `https://api.ipgeolocation.io/ipgeo?apiKey=${apiKey}&ip=${ip}`;
                const response = await fetch(apiUrl);
                const data = await response.json();

                const status = data.ip ? 'True' : 'False';
                const org = data.organization || 'N/A';
                const city = data.city || 'N/A';
                const country = data.country_name || 'N/A';
                const countryIso = data.country_code2 || 'N/A';
                const state = data.state_prov || 'N/A';
                const asn = data.asn || 'N/A';

                resultContainer.innerHTML = `
                    <p><span>IP:</span> ${ip}</p>
                    <p><span>COUNTRY:</span> ${country}</p>
                    <p><span>COUNTRY ISO:</span> ${countryIso}</p>
                    <p><span>STATE:</span> ${state}</p>
                    <p><span>CITY:</span> ${city}</p>
                    <p><span>ASN:</span> ${asn}</p>
                    <p><span>ORGANIZATION:</span> ${org}</p>
                    <p><span>Status Proxy:</span> ${status}</p>
                `;
            } catch (error) {
                resultContainer.innerHTML = `
                    <p><span>IP:</span> ${ip}</p>
                    <p><span>Port:</span> ${port}</p>
                    <p class="error">Error: ${error.message}</p>
                    <p><span>Status Proxy:</span> False</p>
                `;
            }
        });
    </script>
</body>
</html>

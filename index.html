<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Status IP Proxy</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        form {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        input {
            padding: 10px;
            margin-right: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 200px;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background-color: #5cb85c;
            color: white;
            cursor: pointer;
            font-weight: 500;
        }
        button:hover {
            background-color: #4cae4c;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .result p {
            font-size: 16px;
            margin: 8px 0;
        }
        .result strong {
            color: #333;
        }
    </style>
</head>
<body>
    <h1>Cek Status IP Proxy</h1>
    <form id="proxyForm">
        <label for="ipPort">IP:Port:</label>
        <input type="text" id="ipPort" placeholder="Masukkan IP:Port" required>
        <button type="submit">Cek</button>
    </form>

    <div class="result" id="result"></div>

    <script>
        document.getElementById('proxyForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const ipPort = document.getElementById('ipPort').value;
            const [ip, port] = ipPort.split(':');
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '';

            if (!ip || !port) {
                alert('Format IP:Port tidak valid.');
                return;
            }

            try {
                // Mengambil informasi dari API edtunnel.best
                const apiUrlEDTunnel = `https://proxyip.edtunnel.best/api?ip=${ip}&host=speed.cloudflare.com&port=${port}&tls=true`;
                const response = await fetch(apiUrlEDTunnel);
                const data = await response.json();

                resultDiv.innerHTML = `
                    <p><strong>IP:</strong> ${data.ip}</p>
                    <p><strong>ASN:</strong> ${data.asn}</p>
                    <p><strong>Organisation:</strong> ${data.asOrganization}</p>
                    <p><strong>City:</strong> ${data.city}</p>
                    <p><strong>Country:</strong> ${data.country}</p>
                    <p><strong>Latitude:</strong> ${data.latitude}</p>
                    <p><strong>Longitude:</strong> ${data.longitude}</p>
                    <p><strong>Proxy:</strong> ${data.proxy ? 'Yes' : 'No'}</p>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<p>Error: ${error.message}</p>`;
            }
        });
    </script>
</body>
</html>

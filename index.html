<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengecekan IP Proxy</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        input[type="text"] {
            width: calc(100% - 22px);
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            background: #e9ecef;
            border-radius: 4px;
            line-height: 1.5;
        }
    </style>
    <script>
        async function checkProxy() {
            const input = document.getElementById("ipInput").value.trim();
            const [ip, port = '443'] = input.split(':'); // Default port to 443

            // Validasi IP
            const ipRegex = /^(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){2}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$/;
            if (!ipRegex.test(ip)) {
                document.getElementById("result").innerText = 'Masukkan format IP:Port yang valid.';
                return;
            }

            // Cek status proxy
            const proxyApiUrl = `https://proxyip.edtunnel.best/api/proxy?ip=${ip}&port=${port}`;
            let resultContent = '';
            try {
                const proxyResponse = await fetch(proxyApiUrl);
                if (!proxyResponse.ok) throw new Error('Gagal menghubungi API proxy');
                const proxyData = await proxyResponse.json();

                resultContent = `
                    <strong>Informasi Proxy:</strong><br>
                    IP: ${proxyData.ip}<br>
                    Lokasi: ${proxyData.location || 'Tidak tersedia'}<br>
                    Data Center: ${proxyData.data_center || 'Tidak tersedia'}<br>
                    Port: ${proxyData.origin || port}<br>
                    Proxy IP: ${proxyData.proxy ? 'Aktif' : 'Mati'}<br>
                    Reverse: ${proxyData.reverse ? 'Ya' : 'Tidak'}<br>
                    Warp: ${proxyData.warp ? 'Aktif' : 'Nonaktif'}<br>
                    ASN: ${proxyData.asn || 'Tidak tersedia'}<br>
                    Organisasi: ${proxyData.organization || 'Tidak tersedia'}<br>
                `;
            } catch (error) {
                resultContent = `Error: ${error.message}`;
            }

            // Tampilkan hasil
            document.getElementById("result").innerHTML = resultContent;
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>Pengecekan IP Proxy</h1>
        <input type="text" id="ipInput" placeholder="Masukkan IP:Port" required>
        <button onclick="checkProxy()">Cek Status</button>
        <div id="result"></div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy IP Status Checker</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #eef2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        input[type="text"] {
            width: calc(100% - 20px);
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            background-color: #f0f9f4;
            padding: 15px;
            margin-top: 20px;
            border-radius: 8px;
            color: #333;
        }
        .result p {
            margin: 8px 0;
        }
        .active {
            color: green;
        }
        .inactive {
            color: red;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Check Proxy IP</h2>
        <input type="text" id="proxyInput" placeholder="Enter Proxy IP:Port (e.g., 192.168.1.1:8080)">
        <button onclick="checkProxy()">Check Status</button>
        <div class="result" id="result"></div>
    </div>

    <script>
        const apiUrls = [
            'https://proxyip.edtunnel.best/api?ip={ip}&host=speed.cloudflare.com&port={port}&tls=true',
            'https://cfport-1-n2942152.deta.app/check?ip={ip}&host=speed.cloudflare.com&port={port}&tls=true',
            'https://p01--boiling-frame--kw6dd7bjv2nr.code.run/check?ip={ip}&host=speed.cloudflare.com&port={port}&tls=true'
        ];

        async function checkProxy() {
            const proxyInput = document.getElementById('proxyInput').value;
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Checking...</p>';

            // Validasi input
            if (!proxyInput || !proxyInput.includes(':')) {
                resultDiv.innerHTML = '<p style="color: red;">Please enter a valid proxy IP and port (e.g., 192.168.1.1:8080).</p>';
                return;
            }

            const [ip, port] = proxyInput.split(':');
            if (!ip || !port) {
                resultDiv.innerHTML = '<p style="color: red;">Please enter both IP and Port.</p>';
                return;
            }

            resultDiv.innerHTML = '<p>Checking status for IP: ' + ip + ', Port: ' + port + '...</p>';

            // Loop melalui API untuk memeriksa status proxy
            let apiResponse = null;
            for (const apiUrl of apiUrls) {
                const url = apiUrl.replace('{ip}', ip).replace('{port}', port);
                try {
                    const response = await fetch(url);
                    const data = await response.json();
                    
                    if (data) {
                        apiResponse = data;
                        break; // Berhenti setelah mendapatkan respons dari API
                    }
                } catch (error) {
                    console.log('Error fetching from API:', error);
                }
            }

            // Tampilkan hasil
            if (apiResponse) {
                const status = apiResponse.active ? 'Active' : 'Inactive';
                resultDiv.innerHTML = `
                    <p><strong>Input:</strong> ${proxyInput}</p>
                    <p><strong>IP:</strong> ${ip}</p>
                    <p><strong>Port:</strong> ${port}</p>
                    <p><strong>ASN:</strong> ${apiResponse.asn || 'N/A'}</p>
                    <p><strong>ISP:</strong> ${apiResponse.isp || 'N/A'}</p>
                    <p><strong>ORG:</strong> ${apiResponse.org || 'N/A'}</p>
                    <p><strong>Country:</strong> ${apiResponse.country || 'N/A'}</p>
                    <p><strong>Status ProxyIP:</strong> <span class="${status === 'Active' ? 'active' : 'inactive'}">${status}</span></p>
                    <p><strong>Warp:</strong> ${apiResponse.warp || 'off'}</p>
                `;
            } else {
                resultDiv.innerHTML = '<p style="color: red;">Failed to check proxy status. Please try again later.</p>';
            }
        }
    </script>

</body>
</html>

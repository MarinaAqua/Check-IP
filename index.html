<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengecekan IP Proxy ISP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        input[type="text"] {
            width: calc(100% - 22px);
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            background: #e9ecef;
            border-radius: 4px;
            line-height: 1.5;
        }
    </style>
    <script>
        async function checkProxy() {
            const input = document.getElementById("ipInput").value;
            const [ip, port] = input.split(':');

            if (!ip || !port) {
                document.getElementById("result").innerText = 'Masukkan format IP:Port yang valid.';
                return;
            }

            const url = `https://api.ipgeolocation.io/ipgeo?apiKey=YOUR_API_KEY&ip=${ip}`;
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("IP tidak valid atau tidak terhubung");
                const data = await response.json();

                const result = `
                    <strong>Informasi IP:</strong><br>
                    IP: ${data.ip}<br>
                    Port: ${port}<br>
                    ASN: ${data.asn}<br>
                    ISP: ${data.isp}<br>
                    Domain: ${data.domain || 'Tidak tersedia'}<br>
                    Lokasi: ${data.city}, ${data.country_name}<br>
                    Latitude: ${data.latitude}<br>
                    Longitude: ${data.longitude}<br>
                    Kode Negara: ${data.country_code}<br>
                    Waktu Respons: ${data.response_time || 'Tidak tersedia'}<br>
                    Jenis Koneksi: ${data.connection_type || 'Tidak tersedia'}<br>
                    Status: ${data.isp ? 'Aktif' : 'Mati'}
                `;
                document.getElementById("result").innerHTML = result;
            } catch (error) {
                document.getElementById("result").innerText = `Error: ${error.message}`;
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>Pengecekan IP Proxy ISP</h1>
        <input type="text" id="ipInput" placeholder="Masukkan IP:Port" required>
        <button onclick="checkProxy()">Cek Status</button>
        <div id="result"></div>
    </div>
</body>
</html>

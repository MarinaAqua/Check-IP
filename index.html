<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek IP Proxy</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        form {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        input {
            padding: 10px;
            margin-right: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 200px;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background-color: #5cb85c;
            color: white;
            cursor: pointer;
            font-weight: 500;
        }
        button:hover {
            background-color: #4cae4c;
        }
        .result-container {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            padding: 20px;
            margin-top: 20px;
            max-width: 400px;
            margin: 20px auto;
        }
        .result-container p {
            margin: 8px 0;
            font-size: 16px;
        }
        .result-container span {
            font-weight: bold;
            display: inline-block;
            width: 150px;
        }
    </style>
</head>
<body>
    <h1>Cek Status IP Proxy</h1>
    <form id="proxyForm">
        <label for="ipPort">IP:Port:</label>
        <input type="text" id="ipPort" placeholder="Masukkan IP:Port" required>
        <button type="submit">Cek</button>
    </form>

    <div id="resultContainer" class="result-container"></div>

    <script>
        const ipGeolocationApiKey = '02b4a2362c5147ec9996da7d6ceccd4c'; // Ganti dengan kunci API ipgeolocation.io Anda
        const ipInfoToken = 'acbb42696f81c4'; // Ganti dengan kunci API ipinfo.io Anda

        document.getElementById('proxyForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const ipPort = document.getElementById('ipPort').value;
            const [ip, port] = ipPort.split(':');
            const resultContainer = document.getElementById('resultContainer');
            resultContainer.innerHTML = '';

            if (!ip || !port) {
                alert('Format IP:Port tidak valid.');
                return;
            }

            try {
                // Ambil data dari ipgeolocation.io
                const apiUrlGeolocation = `https://api.ipgeolocation.io/ipgeo?apiKey=${ipGeolocationApiKey}&ip=${ip}`;
                const geoResponse = await fetch(apiUrlGeolocation);
                const geoData = await geoResponse.json();

                // Ambil data ASN dari ipinfo.io
                const apiUrlIpInfo = `https://ipinfo.io/${ip}?token=${ipInfoToken}`;
                const ipInfoResponse = await fetch(apiUrlIpInfo);
                const ipInfoData = await ipInfoResponse.json();

                // Ambil data dari proxyip.edtunnel.best
                const apiUrlEdTunnel = `https://proxyip.edtunnel.best/api?ip=${ip}&host=speed.cloudflare.com&port=${port}&tls=true`;
                const edTunnelResponse = await fetch(apiUrlEdTunnel);
                const edTunnelData = await edTunnelResponse.json();

                // Ambil data dari cfport-1-n2942152.deta.app
                const apiUrlDeta = `https://cfport-1-n2942152.deta.app/check?ip=${ip}&host=speed.cloudflare.com&port=${port}&tls=true`;
                const detaResponse = await fetch(apiUrlDeta);
                const detaData = await detaResponse.json();

                // Ambil data dari p01--boiling-frame--kw6dd7bjv2nr.code.run
                const apiUrlBoilingFrame = `https://p01--boiling-frame--kw6dd7bjv2nr.code.run/check?ip=${ip}&host=speed.cloudflare.com&port=${port}&tls=true`;
                const boilingFrameResponse = await fetch(apiUrlBoilingFrame);
                const boilingFrameData = await boilingFrameResponse.json();

                // Tampilkan hasil
                const status = geoData.ip ? 'True' : 'False';
                const org = geoData.organization || 'N/A';
                const city = geoData.city || 'N/A';
                const country = geoData.country_name || 'N/A';
                const countryIso = geoData.country_code2 || 'N/A';
                const state = geoData.state_prov || 'N/A';
                const asn = ipInfoData.org || 'N/A';

                // Data dari API lain
                const edtunnelStatus = edTunnelData.status || 'N/A';
                const detaStatus = detaData.status || 'N/A';
                const boilingFrameStatus = boilingFrameData.status || 'N/A';

                resultContainer.innerHTML = `
                    <p><span>IP:</span> ${ip}</p>
                    <p><span>COUNTRY:</span> ${country}</p>
                    <p><span>COUNTRY ISO:</span> ${countryIso}</p>
                    <p><span>STATE:</span> ${state}</p>
                    <p><span>CITY:</span> ${city}</p>
                    <p><span>ASN:</span> ${asn}</p>
                    <p><span>ORGANIZATION:</span> ${org}</p>
                    <p><span>Status Proxy:</span> ${status}</p>
                    <p><span>EDTunnel Status:</span> ${edtunnelStatus}</p>
                    <p><span>Deta Status:</span> ${detaStatus}</p>
                    <p><span>Boiling Frame Status:</span> ${boilingFrameStatus}</p>
                `;
            } catch (error) {
                resultContainer.innerHTML = `
                    <p><span>IP:</span> ${ip}</p>
                    <p><span>Port:</span> ${port}</p>
                    <p class="error">Error: ${error.message}</p>
                    <p><span>Status Proxy:</span> False</p>
                `;
            }
        });
    </script>
</body>
</html>

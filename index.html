<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy Status Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 20px;
            display: none;
        }
        .result p {
            margin: 0;
            padding: 5px;
        }
        .status-active {
            color: green;
        }
        .status-inactive {
            color: red;
        }
        .error {
            color: red;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Proxy Status Checker</h2>
    <input type="text" id="proxyInput" placeholder="Masukkan IP:Port">
    <button onclick="checkProxy()">Cek Status</button>
    <div class="result" id="result"></div>
</div>

<script>
    const apiUrls = [
        'https://proxyip.edtunnel.best/api?ip={ip}&host=speed.cloudflare.com&port={port}&tls=true',
        'https://cfport-1-n2942152.deta.app/check?ip={ip}&host=speed.cloudflare.com&port={port}&tls=true',
        'https://p01--boiling-frame--kw6dd7bjv2nr.code.run/check?ip={ip}&host=speed.cloudflare.com&port={port}&tls=true'
    ];

    async function checkProxy() {
        const proxyInput = document.getElementById('proxyInput').value;
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = ''; // Reset result
        resultDiv.style.display = 'none';

        if (!proxyInput.includes(':')) {
            resultDiv.innerHTML = '<p class="error">Format IP dan port tidak valid! Gunakan format IP:Port.</p>';
            resultDiv.style.display = 'block';
            return;
        }

        const [ip, port] = proxyInput.split(':');
        
        try {
            // Fetch API dari setiap endpoint
            const apiResponses = await Promise.all(apiUrls.map(url => 
                fetch(url.replace('{ip}', ip).replace('{port}', port))
                    .then(res => res.json())
                    .catch(() => null) // Catch error dan return null
            ));

            const validResponse = apiResponses.find(res => res && typeof res === 'object');

            if (validResponse) {
                const { active, ip: responseIp, asn, isp, org, country, warp } = validResponse;

                resultDiv.innerHTML = `
                    <p><strong>IP:</strong> ${responseIp || ip}</p>
                    <p><strong>ASN:</strong> ${asn || 'N/A'}</p>
                    <p><strong>ISP:</strong> ${isp || 'N/A'}</p>
                    <p><strong>ORG:</strong> ${org || 'N/A'}</p>
                    <p><strong>Country:</strong> ${country || 'N/A'}</p>
                    <p><strong>Status Proxy:</strong> <span class="${active ? 'status-active' : 'status-inactive'}">${active ? 'Active' : 'Inactive'}</span></p>
                    <p><strong>Warp:</strong> ${warp || 'off'}</p>
                `;
            } else {
                resultDiv.innerHTML = '<p class="error">Tidak ada respons valid dari API. Coba lagi nanti.</p>';
            }

        } catch (error) {
            resultDiv.innerHTML = '<p class="error">Terjadi kesalahan. Coba lagi nanti.</p>';
        }

        resultDiv.style.display = 'block';
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengecekan IP Proxy dan ASN</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            margin: 0 auto; /* Pusatkan secara horizontal */
            position: relative;
            top: 50px; /* Jarak dari atas */
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
            margin-bottom: 15px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            background-color: #f0f8ff;
            border: 1px solid #007bff;
            display: none;
        }
        .result p {
            margin: 5px 0;
        }
        .status-active {
            color: green;
            font-weight: bold;
        }
        .status-inactive {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Pengecekan IP Proxy dan ASN</h2>
        <input type="text" id="proxyInput" placeholder="Masukkan IP atau IP:Port">
        <button onclick="checkProxy()">Cek Status</button>
        <div class="result" id="result"></div>
    </div>

    <script>
        const apiUrls = [
            'https://proxyip.edtunnel.best/api?ip={ip}&host=speed.cloudflare.com&port={port}&tls=true',
            'https://cfport-1-n2942152.deta.app/check?ip={ip}&host=speed.cloudflare.com&port={port}&tls=true',
            'https://p01--boiling-frame--kw6dd7bjv2nr.code.run/check?ip={ip}&host=speed.cloudflare.com&port={port}&tls=true'
        ];

        async function checkProxy() {
            const proxyInput = document.getElementById('proxyInput').value;
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'none'; // Sembunyikan hasil sebelumnya

            if (!proxyInput.includes(':')) {
                resultDiv.innerHTML = '<p style="color: red;">Format IP dan port tidak valid!</p>';
                resultDiv.style.display = 'block';
                return;
            }

            const [ip, port] = proxyInput.split(':');
            const apiResponses = await Promise.all(apiUrls.map(url => 
                fetch(url.replace('{ip}', ip).replace('{port}', port)).then(res => res.json()).catch(() => null)
            ));
            const response = apiResponses.find(res => res); // Ambil response pertama yang valid

            if (response) {
                resultDiv.innerHTML = `
                    <p><strong>Input:</strong> ${proxyInput}</p>
                    <p><strong>IP:</strong> ${response.ip || ip}</p>
                    <p><strong>ASN:</strong> ${response.asn || 'N/A'}</p>
                    <p><strong>ISP:</strong> ${response.isp || 'N/A'}</p>
                    <p><strong>ORG:</strong> ${response.org || 'N/A'}</p>
                    <p><strong>Country:</strong> ${response.country || 'N/A'}</p>
                    <p><strong>Status ProxyIP:</strong> <span class="${response.active ? 'status-active' : 'status-inactive'}">${response.active ? 'Active' : 'Inactive'}</span></p>
                    <p><strong>Warp:</strong> ${response.warp || 'off'}</p>
                `;
            } else {
                resultDiv.innerHTML = '<p style="color: red;">Gagal memeriksa status proxy. Coba lagi nanti.</p>';
            }

            resultDiv.style.display = 'block'; // Tampilkan hasil
        }
    </script>

</body>
</html>
